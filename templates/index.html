<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法人間取引 営業候補評価アプリ</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "平角ゴシック Pro W3", "Hiragino Kaku Gothic Pro", メイリオ, Meiryo, sans-serif;
      margin: 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #ffffff;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn-retry {
      background-color: #d97706;
      margin-top: 10px;
    }
    .btn-retry:hover:not(:disabled) {
      background-color: #b45309;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .status-badge.unconfirmed {
      background-color: #e2e8f0;
      color: #64748b;
    }
    .status-badge.confirmed {
      background-color: #dcfce7;
      color: #16a34a;
    }

    .progress-wrapper {
      margin-top: 20px;
      padding: 15px 10px;
      background-color: #f1f5f9;
      border-radius: 6px;
    }
    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #cbd5e1;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      z-index: 2;
      transition: all 0.3s ease;
    }
    .step-label {
      font-size: 12px;
      font-weight: bold;
      color: #64748b;
      text-align: center;
      transition: all 0.3s ease;
    }
    .step-line {
      height: 3px;
      background-color: #cbd5e1;
      flex: 1;
      margin: 0 -15px 22px -15px;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .step-item.active .step-circle {
      background-color: #2563eb;
      color: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
      animation: pulse 1.5s infinite;
    }
    .step-item.active .step-label {
      color: #2563eb;
    }
    .step-item.completed .step-circle {
      background-color: #16a34a;
      color: white;
      font-size: 16px;
    }
    .step-item.completed .step-label {
      color: #16a34a;
    }
    .step-line.completed {
      background-color: #16a34a;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .candidate-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 6px;
    }
    .candidate-title {
      font-size: 15px;
      font-weight: bold;
      color: #0369a1;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .candidate-group {
      margin-bottom: 15px;
    }
    .candidate-group h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #334155;
    }
    .candidate-item {
      background: #ffffff;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }
    .candidate-item:hover {
      border-color: #3b82f6;
    }
    .candidate-item input[type="radio"] {
      margin-top: 3px;
      margin-right: 10px;
    }
    .candidate-details strong {
      color: #0f172a;
      font-size: 14px;
    }
    .candidate-details p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #64748b;
    }
    .result-section {
      margin-top: 30px;
      border-top: 2px solid #e2e8f0;
      padding-top: 20px;
    }
    .hq-address {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 25px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #f8fafc;
      font-weight: bold;
    }
    .badge-container {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .badge {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .badge-ses {
      background-color: #dcfce7;
      color: #15803d;
    }
    .badge-ai {
      background-color: #fef9c3;
      color: #a16207;
    }
    .error-box {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 4px;
      margin-top: 15px;
      font-size: 14px;
    }
    .error-box .error-msg {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .error-detail-toggle {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #991b1b;
      text-decoration: underline;
      cursor: pointer;
    }
    .error-detail-content {
      display: none;
      margin-top: 8px;
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #fecaca;
      border-radius: 4px;
      font-size: 11px;
      color: #7f1d1d;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>法人間取引 営業候補評価アプリ</h1>

  <!-- 入力エリア -->
  <div class="form-group">
    <label>
      受注側会社名
      <span id="hqStatusBadge" class="status-badge unconfirmed">未確定</span>
    </label>
    <input type="text" id="hqInput" value="CLINKS">
  </div>
  <div class="form-group">
    <label>
      取引先候補会社名
      <span id="targetStatusBadge" class="status-badge unconfirmed">未確定</span>
    </label>
    <input type="text" id="targetInput" placeholder="例: アルファ">
  </div>

  <button id="mainBtn" class="btn" onclick="handleMainAction()">評価開始</button>

  <!-- プログレスバー -->
  <div id="progressWrapper" class="progress-wrapper" style="display:none;">
    <div class="progress-bar">
      <div class="step-item" id="step1">
        <div class="step-circle" id="circle1">1</div>
        <div class="step-label">企業検索</div>
      </div>
      <div class="step-line" id="line1"></div>

      <div class="step-item" id="step2">
        <div class="step-circle" id="circle2">2</div>
        <div class="step-label">情報収集</div>
      </div>
      <div class="step-line" id="line2"></div>

      <div class="step-item" id="step3">
        <div class="step-circle" id="circle3">3</div>
        <div class="step-label">AI分析</div>
      </div>
    </div>
  </div>

  <div id="errorBox" class="error-box" style="display:none;">
    <div class="error-msg" id="errorMsg"></div>
    <button id="retryBtn" class="btn btn-retry" style="display:none;" onclick="handleRetry()">再試行</button>
    <div>
      <span class="error-detail-toggle" id="errorDetailToggle" onclick="toggleErrorDetail()" style="display:none;">詳細を表示</span>
    </div>
    <div class="error-detail-content" id="errorDetailContent"></div>
  </div>

  <!-- 複数候補エリア -->
  <div id="candidateBox" class="candidate-box" style="display:none;">
    <div class="candidate-title">以下から選択、または今一度正確な社名を入力してください</div>

    <div id="hqCandidateGroup" class="candidate-group" style="display:none;">
      <h4>受注側会社の選択</h4>
      <div id="hqCandidates"></div>
    </div>

    <div id="targetCandidateGroup" class="candidate-group" style="display:none;">
      <h4>取引先候補会社の選択</h4>
      <div id="targetCandidates"></div>
    </div>
  </div>

  <!-- 評価結果表示 -->
  <div id="resultSection" class="result-section" style="display:none;">
    <div class="hq-address">
      取引先本社所在地: <span id="resHq"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th>評価項目</th>
          <th>SES・システム開発</th>
          <th>AIドリブン開発</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody">
      </tbody>
    </table>

    <div class="badge-container">
      <div class="badge badge-ses" id="sesBadge">
        SES評価: -
      </div>
      <div class="badge badge-ai" id="aiBadge">
        AI評価: -
      </div>
    </div>
  </div>
</div>

<script>
const METRIC_NAMES = {
  fit: "適合度",
  scale: "規模感",
  continuity: "継続性",
  growth: "成長性",
  strategy: "戦略性",
  trust: "信頼性",
  info: "情報量",
  total: "合計"
};

// 確定状態管理
let hqConfirmed = false;
let targetConfirmed = false;
let hqConfirmedValue = "";
let targetConfirmedValue = "";

// 候補選択待ち状態
let needHqSelect = false;
let needTargetSelect = false;

// 直近のエラーがリトライ可能（AI/通信系）だったかどうか
let lastErrorRetryable = false;

document.addEventListener('DOMContentLoaded', () => {
  const hqInput = document.getElementById('hqInput');
  const targetInput = document.getElementById('targetInput');

  hqInput.addEventListener('input', () => {
    needHqSelect = false;
    if (hqConfirmed && hqInput.value.trim() !== hqConfirmedValue) {
      hqConfirmed = false;
      updateStatusBadge('hq', false);
    }
    const radios = document.querySelectorAll('input[name="selectedHq"]');
    radios.forEach(r => r.checked = false);
    checkAndEnableButton();
  });

  targetInput.addEventListener('input', () => {
    needTargetSelect = false;
    if (targetConfirmed && targetInput.value.trim() !== targetConfirmedValue) {
      targetConfirmed = false;
      updateStatusBadge('target', false);
    }
    const radios = document.querySelectorAll('input[name="selectedTarget"]');
    radios.forEach(r => r.checked = false);
    checkAndEnableButton();
  });
});

function updateStatusBadge(which, isConfirmed) {
  const badge = document.getElementById(which === 'hq' ? 'hqStatusBadge' : 'targetStatusBadge');
  if (isConfirmed) {
    badge.textContent = '✅ 確定済み';
    badge.classList.remove('unconfirmed');
    badge.classList.add('confirmed');
  } else {
    badge.textContent = '未確定';
    badge.classList.remove('confirmed');
    badge.classList.add('unconfirmed');
  }
}

function updateProgress(stepStates) {
  const wrapper = document.getElementById('progressWrapper');
  wrapper.style.display = 'block';

  for (let i = 1; i <= 3; i++) {
    const item = document.getElementById(`step${i}`);
    const circle = document.getElementById(`circle${i}`);
    const state = stepStates[i - 1];

    item.classList.remove('active', 'completed', 'pending');
    item.classList.add(state);

    if (state === 'completed') {
      circle.textContent = '✅';
    } else {
      circle.textContent = i;
    }

    if (i < 3) {
      const line = document.getElementById(`line${i}`);
      line.classList.remove('completed');
      if (state === 'completed') {
        line.classList.add('completed');
      }
    }
  }
}

function hideProgress() {
  document.getElementById('progressWrapper').style.display = 'none';
}

function setButtonState(enabled) {
  const btn = document.getElementById('mainBtn');
  btn.disabled = !enabled;
}

function clearPreviousState() {
  hideError();
  document.getElementById('candidateBox').style.display = 'none';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('hqCandidateGroup').style.display = 'none';
  document.getElementById('targetCandidateGroup').style.display = 'none';
  document.getElementById('hqCandidates').innerHTML = '';
  document.getElementById('targetCandidates').innerHTML = '';
}

function hideError() {
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('errorDetailToggle').style.display = 'none';
  document.getElementById('errorDetailContent').style.display = 'none';
  document.getElementById('errorDetailContent').textContent = '';
  lastErrorRetryable = false;
}

function showError(message, options) {
  options = options || {};
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const retryBtn = document.getElementById('retryBtn');
  const detailToggle = document.getElementById('errorDetailToggle');
  const detailContent = document.getElementById('errorDetailContent');

  errorMsg.textContent = message;
  errorBox.style.display = 'block';

  if (options.retryable) {
    retryBtn.style.display = 'inline-block';
    lastErrorRetryable = true;
  } else {
    retryBtn.style.display = 'none';
    lastErrorRetryable = false;
  }

  if (options.detail) {
    detailToggle.style.display = 'inline-block';
    detailContent.textContent = options.detail;
  } else {
    detailToggle.style.display = 'none';
    detailContent.textContent = '';
  }
  detailContent.style.display = 'none';
}

function toggleErrorDetail() {
  const content = document.getElementById('errorDetailContent');
  content.style.display = (content.style.display === 'none' || !content.style.display) ? 'block' : 'none';
}

// エラー内容を判定して「AI一時的エラー」か「入力不備」かを振り分ける
function classifyAndShowError(data, httpStatus) {
  const rawMsg = (data && data.error) ? data.error : '不明なエラーが発生しました。';

  const isAiTransient =
    rawMsg.includes('NO_VALID_RESPONSE_GENERATED') ||
    rawMsg.includes('JSONとして解析できません') ||
    httpStatus >= 500 ||
    httpStatus === 422;

  if (isAiTransient) {
    showError('⚠️ AIの一時的なエラーが発生しました。もう一度お試しください。', {
      retryable: true,
      detail: rawMsg
    });
  } else {
    showError(rawMsg, { retryable: false });
  }
}

async function handleMainAction() {
  const hq = document.getElementById('hqInput').value.trim();
  const target = document.getElementById('targetInput').value.trim();

  clearPreviousState();

  if (!hq || !target) {
    showError('受注側会社名と取引先候補会社名の両方を入力してください。', { retryable: false });
    return;
  }

  setButtonState(false);

  // 両方確定済みなら検索フェーズを完全スキップ
  if (hqConfirmed && targetConfirmed) {
    updateProgress(['completed', 'active', 'pending']);
    await runEvaluation();
    return;
  }

  updateProgress(['active', 'pending', 'pending']);

  try {
    const res = await fetch('/search_candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ headquarters_company: hq, target_company: target })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      hideProgress();
      setButtonState(true);
      classifyAndShowError(data, res.status);
      return;
    }

    const hqRes = data.hq_res;
    const targetRes = data.target_res;

    if (!hqConfirmed) {
      if (hqRes.status === 'single') {
        document.getElementById('hqInput').value = hqRes.exact_name;
        hqConfirmed = true;
        hqConfirmedValue = hqRes.exact_name;
        updateStatusBadge('hq', true);
        needHqSelect = false;
      } else {
        needHqSelect = true;
      }
    }

    if (!targetConfirmed) {
      if (targetRes.status === 'single') {
        document.getElementById('targetInput').value = targetRes.exact_name;
        targetConfirmed = true;
        targetConfirmedValue = targetRes.exact_name;
        updateStatusBadge('target', true);
        needTargetSelect = false;
      } else {
        needTargetSelect = true;
      }
    }

    if (!needHqSelect && !needTargetSelect) {
      updateProgress(['completed', 'active', 'pending']);
      await runEvaluation();
      return;
    }

    // 候補選択待ちの間はプログレスバーを消す（ユーザー操作フェーズのため）
    hideProgress();

    if (needHqSelect) {
      renderCandidates('hqCandidates', hqRes.candidates, 'selectedHq', onHqSelect);
      document.getElementById('hqCandidateGroup').style.display = 'block';
    }
    if (needTargetSelect) {
      renderCandidates('targetCandidates', targetRes.candidates, 'selectedTarget', onTargetSelect);
      document.getElementById('targetCandidateGroup').style.display = 'block';
    }

    document.getElementById('candidateBox').style.display = 'block';
    checkAndEnableButton();

  } catch (err) {
    hideProgress();
    setButtonState(true);
    showError('⚠️ 通信エラーが発生しました。もう一度お試しください。', { retryable: true, detail: String(err) });
  }
}

function handleRetry() {
  hideError();
  // confirmed済みならhandleMainActionが自動的に検索をスキップしてevaluateへ直行する
  handleMainAction();
}

function renderCandidates(containerId, candidates, radioName, selectCallback) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  candidates.forEach(c => {
    const div = document.createElement('div');
    div.className = 'candidate-item';
    div.innerHTML = `
      <input type="radio" name="${radioName}" value="${escapeHtml(c.display_name)}">
      <div class="candidate-details">
        <strong>${escapeHtml(c.display_name)}</strong>
        <p>${escapeHtml(c.snippet)}</p>
      </div>
    `;
    div.onclick = () => {
      const radio = div.querySelector('input[type="radio"]');
      radio.checked = true;
      selectCallback(c.display_name);
    };
    container.appendChild(div);
  });
}

function onHqSelect(selectedName) {
  document.getElementById('hqInput').value = selectedName;
  hqConfirmed = true;
  hqConfirmedValue = selectedName;
  updateStatusBadge('hq', true);
  needHqSelect = false;
  checkAndEnableButton();
}

function onTargetSelect(selectedName) {
  document.getElementById('targetInput').value = selectedName;
  targetConfirmed = true;
  targetConfirmedValue = selectedName;
  updateStatusBadge('target', true);
  needTargetSelect = false;
  checkAndEnableButton();
}

function checkAndEnableButton() {
  const hqVal = document.getElementById('hqInput').value.trim();
  const targetVal = document.getElementById('targetInput').value.trim();

  if (hqVal !== '' && targetVal !== '' && !needHqSelect && !needTargetSelect) {
    setButtonState(true);
  } else {
    setButtonState(false);
  }
}

async function runEvaluation() {
  const hqCompany = document.getElementById('hqInput').value.trim();
  const targetCompany = document.getElementById('targetInput').value.trim();

  document.getElementById('candidateBox').style.display = 'none';
  setButtonState(false);

  const timer = setTimeout(() => {
    updateProgress(['completed', 'completed', 'active']);
  }, 2500);

  try {
    const res = await fetch('/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        headquarters_company: hqCompany,
        target_company: targetCompany
      })
    });

    clearTimeout(timer);
    const data = await res.json();

    setButtonState(true);

    if (!res.ok || data.error) {
      hideProgress();
      classifyAndShowError(data, res.status);
      return;
    }

    hideError();
    hideProgress();

    document.getElementById('resHq').textContent = data.headquarters || '確認できませんでした';

    const tbody = document.getElementById('scoreTableBody');
    tbody.innerHTML = '';
    const keys = ['fit', 'scale', 'continuity', 'growth', 'strategy', 'trust', 'info', 'total'];

    keys.forEach(key => {
      const tr = document.createElement('tr');
      const label = METRIC_NAMES[key] || key;
      const sesVal = data.ses ? data.ses[key] : 0;
      const aiVal = data.ai ? data.ai[key] : 0;

      if (key === 'total') {
        tr.style.fontWeight = 'bold';
        tr.style.backgroundColor = '#f8fafc';
      }

      tr.innerHTML = `
        <td>${label}</td>
        <td>${sesVal}</td>
        <td>${aiVal}</td>
      `;
      tbody.appendChild(tr);
    });

    const sesTotal = data.ses ? data.ses.total : 0;
    const sesJudge = data.ses ? data.ses.judgement : '';
    const aiTotal = data.ai ? data.ai.total : 0;
    const aiJudge = data.ai ? data.ai.judgement : '';

    document.getElementById('sesBadge').textContent = `SES評価: ${sesJudge} (${sesTotal}点)`;
    document.getElementById('aiBadge').textContent = `AI評価: ${aiJudge} (${aiTotal}点)`;

    document.getElementById('resultSection').style.display = 'block';

  } catch (err) {
    clearTimeout(timer);
    hideProgress();
    setButtonState(true);
    showError('⚠️ AIの一時的なエラーが発生しました。もう一度お試しください。', { retryable: true, detail: String(err) });
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
