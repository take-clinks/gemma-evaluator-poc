<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法人間取引 営業候補評価アプリ</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "平角ゴシック Pro W3", "Hiragino Kaku Gothic Pro", メイリオ, Meiryo, sans-serif;
      margin: 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #0f172a;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #ffffff;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* プログレスバーのCSSスタイル */
    .progress-wrapper {
      margin-top: 20px;
      padding: 15px 10px;
      background-color: #f1f5f9;
      border-radius: 6px;
    }
    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #cbd5e1;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      z-index: 2;
      transition: all 0.3s ease;
    }
    .step-label {
      font-size: 12px;
      font-weight: bold;
      color: #64748b;
      transition: all 0.3s ease;
    }
    .step-line {
      height: 3px;
      background-color: #cbd5e1;
      flex: 1;
      margin: 0 -15px 22px -15px;
      z-index: 1;
      transition: all 0.3s ease;
    }

    /* ステータス別の状態 */
    .step-item.active .step-circle {
      background-color: #2563eb;
      color: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
      animation: pulse 1.5s infinite;
    }
    .step-item.active .step-label {
      color: #2563eb;
    }
    .step-item.completed .step-circle {
      background-color: #16a34a;
      color: white;
    }
    .step-item.completed .step-label {
      color: #16a34a;
    }
    .step-line.completed {
      background-color: #16a34a;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .candidate-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 6px;
    }
    .candidate-title {
      font-size: 15px;
      font-weight: bold;
      color: #0369a1;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .candidate-group {
      margin-bottom: 15px;
    }
    .candidate-group h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #334155;
    }
    .candidate-item {
      background: #ffffff;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }
    .candidate-item:hover {
      border-color: #3b82f6;
    }
    .candidate-item input[type="radio"] {
      margin-top: 3px;
      margin-right: 10px;
    }
    .candidate-details strong {
      color: #0f172a;
      font-size: 14px;
    }
    .candidate-details p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #64748b;
    }
    .result-section {
      margin-top: 30px;
      border-top: 2px solid #e2e8f0;
      padding-top: 20px;
    }
    .hq-address {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 25px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #f8fafc;
      font-weight: bold;
    }
    .badge-container {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .badge {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
    .badge-ses {
      background-color: #dcfce7;
      color: #15803d;
    }
    .badge-ai {
      background-color: #fef9c3;
      color: #a16207;
    }
    .error-box {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 4px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>法人間取引 営業候補評価アプリ</h1>

  <!-- 入力エリア -->
  <div class="form-group">
    <label>受注側会社名</label>
    <input type="text" id="hqInput" value="CLINKS">
  </div>
  <div class="form-group">
    <label>取引先候補会社名</label>
    <input type="text" id="targetInput" placeholder="例: アルファ">
  </div>
  
  <button id="mainBtn" class="btn" onclick="handleMainAction()">評価開始</button>

  <!-- プログレスバー（評価開始ボタンのすぐ下） -->
  <div id="progressWrapper" class="progress-wrapper" style="display:none;">
    <div class="progress-bar">
      <div class="step-item" id="step1">
        <div class="step-circle" id="circle1">1</div>
        <div class="step-label">企業検索</div>
      </div>
      <div class="step-line" id="line1"></div>
      
      <div class="step-item" id="step2">
        <div class="step-circle" id="circle2">2</div>
        <div class="step-label">会社選択</div>
      </div>
      <div class="step-line" id="line2"></div>
      
      <div class="step-item" id="step3">
        <div class="step-circle" id="circle3">3</div>
        <div class="step-label">情報収集</div>
      </div>
      <div class="step-line" id="line3"></div>
      
      <div class="step-item" id="step4">
        <div class="step-circle" id="circle4">4</div>
        <div class="step-label">AI評価</div>
      </div>
    </div>
  </div>

  <div id="errorBox" class="error-box" style="display:none;"></div>

  <!-- 複数候補がある場合のみ表示されるエリア -->
  <div id="candidateBox" class="candidate-box" style="display:none;">
    <div class="candidate-title">以下から選択または今一度正確な社名を入力</div>
    
    <div id="hqCandidateGroup" class="candidate-group" style="display:none;">
      <h4>受注側会社の選択</h4>
      <div id="hqCandidates"></div>
    </div>

    <div id="targetCandidateGroup" class="candidate-group" style="display:none;">
      <h4>取引先候補会社の選択</h4>
      <div id="targetCandidates"></div>
    </div>
  </div>

  <!-- 評価結果表示 -->
  <div id="resultSection" class="result-section" style="display:none;">
    <div class="hq-address">
      取引先本社所在地: <span id="resHq"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th>評価項目</th>
          <th>SES・システム開発</th>
          <th>AIドリブン開発</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody">
      </tbody>
    </table>

    <div class="badge-container">
      <div class="badge badge-ses" id="sesBadge">
        SES評価: -
      </div>
      <div class="badge badge-ai" id="aiBadge">
        AI評価: -
      </div>
    </div>
  </div>
</div>

<script>
const METRIC_NAMES = {
  fit: "適合度",
  scale: "規模感",
  continuity: "継続性",
  growth: "成長性",
  strategy: "戦略性",
  trust: "信頼性",
  info: "情報量",
  total: "合計"
};

let needHqSelect = false;
let needTargetSelect = false;

// プログレスバーの状態更新関数
function updateProgress(stepStates) {
  // stepStates: e.g. ['active', 'pending', 'pending', 'pending']
  const wrapper = document.getElementById('progressWrapper');
  wrapper.style.display = 'block';

  for (let i = 1; i <= 4; i++) {
    const item = document.getElementById(`step${i}`);
    const circle = document.getElementById(`circle${i}`);
    const state = stepStates[i - 1];

    item.classList.remove('active', 'completed', 'pending');
    item.classList.add(state);

    if (state === 'completed') {
      circle.textContent = '✓';
    } else {
      circle.textContent = i;
    }

    if (i < 4) {
      const line = document.getElementById(`line${i}`);
      line.classList.remove('completed');
      if (state === 'completed') {
        line.classList.add('completed');
      }
    }
  }
}

function hideProgress() {
  document.getElementById('progressWrapper').style.display = 'none';
}

function setButtonState(enabled) {
  const btn = document.getElementById('mainBtn');
  btn.disabled = !enabled;
}

function clearPreviousState() {
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('candidateBox').style.display = 'none';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('hqCandidateGroup').style.display = 'none';
  document.getElementById('targetCandidateGroup').style.display = 'none';
  document.getElementById('hqCandidates').innerHTML = '';
  document.getElementById('targetCandidates').innerHTML = '';
}

async function handleMainAction() {
  const hq = document.getElementById('hqInput').value.trim();
  const target = document.getElementById('targetInput').value.trim();
  const errorBox = document.getElementById('errorBox');

  clearPreviousState();

  if (!hq || !target) {
    errorBox.textContent = '受注側会社名と取引先候補会社名の両方を入力してください。';
    errorBox.style.display = 'block';
    return;
  }

  // ボタンを非アクト化（文字は「評価開始」固定）
  setButtonState(false);
  
  // プログレスバー表示：ステップ1（企業検索）アクティブ
  updateProgress(['active', 'pending', 'pending', 'pending']);

  try {
    const res = await fetch('/search_candidates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ headquarters_company: hq, target_company: target })
    });
    const data = await res.json();

    if (data.error) {
      hideProgress();
      setButtonState(true);
      errorBox.textContent = data.error;
      errorBox.style.display = 'block';
      return;
    }

    const hqRes = data.hq_res;
    const targetRes = data.target_res;

    if (hqRes.status === 'single') {
      document.getElementById('hqInput').value = hqRes.exact_name;
      needHqSelect = false;
    } else {
      needHqSelect = true;
    }

    if (targetRes.status === 'single') {
      document.getElementById('targetInput').value = targetRes.exact_name;
      needTargetSelect = false;
    } else {
      needTargetSelect = true;
    }

    // パターンA: 両方1意確定 ➔ スルーして即評価へ
    if (!needHqSelect && !needTargetSelect) {
      updateProgress(['completed', 'completed', 'active', 'pending']);
      await runEvaluation();
      return;
    }

    // パターンB: 複数候補あり ➔ ステップ2（会社選択）アクティブ
    updateProgress(['completed', 'active', 'pending', 'pending']);

    if (needHqSelect) {
      renderCandidates('hqCandidates', hqRes.candidates, 'selectedHq', onHqSelect);
      document.getElementById('hqCandidateGroup').style.display = 'block';
    }
    if (needTargetSelect) {
      renderCandidates('targetCandidates', targetRes.candidates, 'selectedTarget', onTargetSelect);
      document.getElementById('targetCandidateGroup').style.display = 'block';
    }

    document.getElementById('candidateBox').style.display = 'block';
    setButtonState(false);

  } catch (err) {
    hideProgress();
    setButtonState(true);
    errorBox.textContent = '通信エラーが発生しました。';
    errorBox.style.display = 'block';
  }
}

function renderCandidates(containerId, candidates, radioName, selectCallback) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  candidates.forEach(c => {
    const div = document.createElement('div');
    div.className = 'candidate-item';
    div.innerHTML = `
      <input type="radio" name="${radioName}" value="${escapeHtml(c.display_name)}">
      <div class="candidate-details">
        <strong>${escapeHtml(c.display_name)}</strong>
        <p>${escapeHtml(c.snippet)}</p>
      </div>
    `;
    div.onclick = () => {
      const radio = div.querySelector('input[type="radio"]');
      radio.checked = true;
      selectCallback(c.display_name);
    };
    container.appendChild(div);
  });
}

function onHqSelect(selectedName) {
  document.getElementById('hqInput').value = selectedName;
  needHqSelect = false;
  checkAndEnableButton();
}

function onTargetSelect(selectedName) {
  document.getElementById('targetInput').value = selectedName;
  needTargetSelect = false;
  checkAndEnableButton();
}

function checkAndEnableButton() {
  if (!needHqSelect && !needTargetSelect) {
    setButtonState(true);
  }
}

async function runEvaluation() {
  const hqCompany = document.getElementById('hqInput').value.trim();
  const targetCompany = document.getElementById('targetInput').value.trim();
  const errorBox = document.getElementById('errorBox');

  document.getElementById('candidateBox').style.display = 'none';
  setButtonState(false);

  // 情報収集アクティブ ➔ タイマーでAI評価アクティブへ切り替え
  updateProgress(['completed', 'completed', 'active', 'pending']);
  
  const timer = setTimeout(() => {
    updateProgress(['completed', 'completed', 'completed', 'active']);
  }, 2500);

  try {
    const res = await fetch('/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        headquarters_company: hqCompany,
        target_company: targetCompany
      })
    });
    
    clearTimeout(timer);
    const data = await res.json();

    // ★重要: 結果が出力されたらプログレスバーを消去する
    hideProgress();
    setButtonState(true);

    if (data.error) {
      errorBox.textContent = data.error;
      errorBox.style.display = 'block';
      return;
    }

    document.getElementById('resHq').textContent = data.headquarters || '確認できませんでした';

    const tbody = document.getElementById('scoreTableBody');
    tbody.innerHTML = '';
    const keys = ['fit', 'scale', 'continuity', 'growth', 'strategy', 'trust', 'info', 'total'];

    keys.forEach(key => {
      const tr = document.createElement('tr');
      const label = METRIC_NAMES[key] || key;
      const sesVal = data.ses ? data.ses[key] : 0;
      const aiVal = data.ai ? data.ai[key] : 0;

      if (key === 'total') {
        tr.style.fontWeight = 'bold';
        tr.style.backgroundColor = '#f8fafc';
      }

      tr.innerHTML = `
        <td>${label}</td>
        <td>${sesVal}</td>
        <td>${aiVal}</td>
      `;
      tbody.appendChild(tr);
    });

    const sesTotal = data.ses ? data.ses.total : 0;
    const sesJudge = data.ses ? data.ses.judgement : '';
    const aiTotal = data.ai ? data.ai.total : 0;
    const aiJudge = data.ai ? data.ai.judgement : '';

    document.getElementById('sesBadge').textContent = `SES評価: ${sesJudge} (${sesTotal}点)`;
    document.getElementById('aiBadge').textContent = `AI評価: ${aiJudge} (${aiTotal}点)`;

    document.getElementById('resultSection').style.display = 'block';

  } catch (err) {
    clearTimeout(timer);
    hideProgress();
    setButtonState(true);
    errorBox.textContent = '評価処理中に通信エラーが発生しました。';
    errorBox.style.display = 'block';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
